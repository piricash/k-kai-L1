name: Deploy Kākāriki Kai Azure infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Provision Azure infrastructure
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate and deploy Bicep infrastructure
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group create \
              --name kakariki-kai-prod-infrastructure \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --template-file infra/azure/main.bicep \
              --parameters \
                environmentName=prod \
                location="${{ vars.AZURE_LOCATION }}" \
                staticWebAppLocation="${{ vars.AZURE_STATIC_WEB_APP_LOCATION }}" \
                apiSiteName="${{ vars.AZURE_API_SITE_NAME }}" \
                sqlServerName="${{ vars.AZURE_SQL_SERVER_NAME }}" \
                staticWebAppName="${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
                sqlDatabaseName="${{ vars.AZURE_SQL_DATABASE_NAME }}" \
                sqlAdministratorLogin="${{ vars.AZURE_SQL_ADMIN_LOGIN }}" \
                sqlAdministratorPassword="${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}" \
                kindeAuthority="${{ vars.KINDE_AUTHORITY }}" \
                kindeAudience="${{ vars.KINDE_API_AUDIENCE }}" \
              --query properties.outputs \
              --output json

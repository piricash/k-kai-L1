name: Apply Kākāriki Kai Azure SQL schema

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    name: Apply authoritative database schema
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and validate database projects
        run: dotnet build KakarikiKai.slnx --configuration Release
      - name: Install EF Core tooling
        run: dotnet tool install --global dotnet-ef --version 10.*
      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Add temporary runner firewall access
        uses: azure/cli@v2
        with:
          inlineScript: |
            RUNNER_IP="$(curl --fail --silent https://api.ipify.org)"
            echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
            az sql server firewall-rule create \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --server "${{ vars.AZURE_SQL_SERVER_NAME }}" \
              --name github-actions-schema \
              --start-ip-address "$RUNNER_IP" \
              --end-ip-address "$RUNNER_IP"
      - name: Apply idempotent EF Core schema migration
        env:
          ConnectionStrings__KakarikiKai: Server=tcp:${{ vars.AZURE_SQL_SERVER_NAME }}.database.windows.net,1433;Initial Catalog=${{ vars.AZURE_SQL_DATABASE_NAME }};User ID=${{ vars.AZURE_SQL_ADMIN_LOGIN }};Password=${{ secrets.AZURE_SQL_ADMIN_PASSWORD }};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;
        run: |
          dotnet ef database update \
            --project src/KakarikiKai.Infrastructure/KakarikiKai.Infrastructure.csproj \
            --startup-project src/KakarikiKai.WebAPI/KakarikiKai.WebAPI.csproj \
            --configuration Release
      - name: Remove temporary runner firewall access
        if: always()
        uses: azure/cli@v2
        with:
          inlineScript: |
            az sql server firewall-rule delete \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --server "${{ vars.AZURE_SQL_SERVER_NAME }}" \
              --name github-actions-schema || true

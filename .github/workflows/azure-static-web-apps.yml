name: Deploy Kākāriki Kai web to Azure Static Web Apps

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    name: Build and publish Azure web client
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check the web client
        run: pnpm check
      - name: Build the web client
        run: pnpm build
        env:
          VITE_KINDE_DOMAIN: ${{ secrets.VITE_KINDE_DOMAIN }}
          VITE_KINDE_CLIENT_ID: ${{ secrets.VITE_KINDE_CLIENT_ID }}
          VITE_KINDE_API_AUDIENCE: ${{ secrets.VITE_KINDE_API_AUDIENCE }}
          VITE_KAKARIKI_API_URL: ${{ secrets.VITE_KAKARIKI_API_URL }}
      - name: Upload the static client
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/public
          api_location: ""
          output_location: ""
          skip_app_build: true

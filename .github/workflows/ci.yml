name: Validate Kākāriki Kai

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Test, type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused POC tests
        run: pnpm test
      - name: Type-check
        run: pnpm check
      - name: Build release bundle
        run: pnpm build
      - name: Restore WMS solution
        run: dotnet restore KakarikiKai.slnx
      - name: Test WMS domain and security boundaries
        run: dotnet test KakarikiKai.slnx --no-restore --verbosity minimal
      - name: Build WMS API release candidate
        run: dotnet build KakarikiKai.slnx --no-restore --configuration Release

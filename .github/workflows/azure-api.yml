name: Deploy Kākāriki Kai API to Azure App Service

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Publish and deploy .NET API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore, test, and publish
        run: |
          dotnet test KakarikiKai.slnx --configuration Release
          dotnet publish src/KakarikiKai.WebAPI/KakarikiKai.WebAPI.csproj --configuration Release --output publish-api
          cd publish-api && zip -r ../kakariki-kai-api.zip .
      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy API package
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_API_SITE_NAME }}" \
              --src-path kakariki-kai-api.zip \
              --type zip \
              --async false
      - name: Verify API health endpoint
        run: curl --fail --retry 8 --retry-delay 5 "https://${{ vars.AZURE_API_SITE_NAME }}.azurewebsites.net/health"
